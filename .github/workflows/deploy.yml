# main ブランチへの変更反映時、または手動実行時に GitHub Pages へ Web アプリを公開するワークフローです。
name: Deploy to GitHub Pages

on:
    push:
        branches: [main]
    # GitHub の Actions 画面から手動でも実行できるようにします。
    workflow_dispatch:

# GitHub Pages へのデプロイに必要な最小限の権限を設定します。
permissions:
    contents: read
    pages: write
    id-token: write

# 同時に複数のデプロイが走って競合しないように制御します（進行中のデプロイはキャンセルせず順番に処理します）。
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # 1. 型チェック・テスト・本番用ビルドを行い、公開用ファイル（dist）をアップロードするジョブ
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Run tests
              run: npm test

            - name: Build
              run: npm run build

            - name: Setup Pages
              uses: actions/configure-pages@v5

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./dist

    # 2. ビルドされた成果物を GitHub Pages 環境にデプロイして公開するジョブ
    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
